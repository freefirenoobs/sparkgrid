<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkGrid - NASA MODIS & VIIRS Hot Spot Harmonization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      body, html, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0d14; color: #fff; }
      .hud { position: absolute; top: 16px; left: 16px; z-index: 1000; background: rgba(10, 15, 26, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 18px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
      .hud h2 { margin: 0 0 4px 0; font-size: 1.25rem; color: #f59e0b; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.3px; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
      .stat-card { background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.06); }
      .stat-card .val { font-size: 1.15rem; font-weight: 800; color: #38bdf8; }
      .stat-card .lbl { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
      .mode-btn { flex: 1; padding: 6px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #94a3b8; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
      .mode-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
      .mode-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; box-shadow: 0 0 10px rgba(56,189,248,0.4); }
      .filter-btn { padding: 4px 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #cbd5e1; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
      .filter-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
      .filter-btn.active { background: rgba(255,255,255,0.22); color: #fff; font-weight: 700; border-width: 1.5px; }
      #map { width: 100%; height: 100%; }
      .leaflet-container { background: #0a0d14 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
